name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      lagoon-ref:
        description: Branch of the Lagoon theme to build against
        default: compose-theme

# A newer push to the same branch cancels this branch's older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: the Linux job publishes the rendered screens to the `screenshots` branch.
  contents: write

env:
  # lagoon-compose is built from source, next to this repository, until it is published.
  LAGOON_REF: ${{ inputs.lagoon-ref || 'compose-theme' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux · Android, desktop
            os: ubuntu-latest
            tasks: ':shared:jvmTest :androidApp:assembleRelease :desktopApp:createReleaseDistributable -Pscreenshots=../screenshots'
          - name: macOS · iOS, desktop
            os: macos-latest
            tasks: ':shared:iosSimulatorArm64Test :shared:linkReleaseFrameworkIosArm64 :desktopApp:createReleaseDistributable'
          - name: Windows · desktop
            os: windows-latest
            tasks: ':desktopApp:createReleaseDistributable'
    defaults:
      run:
        shell: bash
        working-directory: compose-order-desk-demo
    steps:
      - uses: actions/checkout@v7
        with:
          path: compose-order-desk-demo
      - uses: actions/checkout@v7
        with:
          repository: kormcrete/swing-flatlaf-lagoon-theme
          ref: ${{ env.LAGOON_REF }}
          path: swing-flatlaf-lagoon-theme
      # 17 builds; 25 is the runtime the desktop app ships with (JAVA_HOME_25_*).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          set -o pipefail
          ./gradlew ${{ matrix.tasks }} --continue --console=plain --stacktrace 2>&1 | tee build.log
      - name: Memory probe on the packaged release app
        if: success()
        run: |
          set -o pipefail
          app=$(find desktopApp/build/compose/binaries/main-release/app -maxdepth 1 -mindepth 1 | head -1)
          case "$RUNNER_OS" in
            macOS)   launcher="$app/Contents/MacOS/Order Desk" ;;
            Windows) launcher="$app/Order Desk.exe" ;;
            *)       launcher="$app/bin/Order Desk" ;;
          esac
          du -sh "$app" | sed 's/^/packaged app size: /' | tee size.txt
          probe="$PWD/memory.txt"
          [ "$RUNNER_OS" = Windows ] && probe=$(cygpath -w "$probe")
          export JAVA_TOOL_OPTIONS="-Dorderdesk.probe=$probe"
          # macOS has no `timeout`; perl's alarm does the same everywhere.
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq xvfb > /dev/null
            limit 120 xvfb-run -a -s "-screen 0 1920x1080x24" "$launcher" || true
          else
            limit 120 "$launcher" > app.log 2>&1 || echo "app exit code $?" >> app.log
          fi
          [ -f memory.txt ] || { echo "no memory report; the app said:"; tail -15 app.log 2>/dev/null; } > memory.txt
          cat size.txt memory.txt
          report=$(cat size.txt memory.txt | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
          echo "::notice title=Desktop memory (${RUNNER_OS})::${report:-no report}"
      - name: AOT cache, trained at the install path
        if: success()
        continue-on-error: true
        run: |
          jdk="${JAVA_HOME_25_X64:-${JAVA_HOME_25_ARM64:-$JAVA_HOME_25_arm64}}"
          [ "$RUNNER_OS" = Linux ] && sudo apt-get install -y -qq xvfb > /dev/null
          desktopApp/aot/train-and-package.sh "$jdk" aot-out > aot.log 2>&1 || echo "train-and-package.sh failed with exit code $?" >> aot.log
          cat aot.log
          report=$( { cat aot-out/aot.txt aot-out/memory-aot.txt 2>/dev/null | grep -v 'jvm args'; echo '--- log tail'; tail -25 aot.log; } | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
          echo "::notice title=AOT cache (${RUNNER_OS})::${report:-no report}"
      - name: Publish screenshots
        if: success() && runner.os == 'Linux' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/publish-screens.sh screenshots renders
      - name: Report build errors
        if: failure()
        run: |
          errors=$( { grep -E '^e: |error:|Could not|Unresolved|FAILED' build.log | grep -v '^> Task' | head -60
            for f in desktopApp/build/compose/logs/proguardReleaseJars/*.txt; do
              [ -f "$f" ] && { echo "--- $(basename "$f")"; grep -E 'Warning|Error|Note: there were|Unexpected' "$f" | sort | uniq -c | sort -rn | head -40; }
            done
            echo '--- log tail ---'; grep -v '^> Task\|^\s*at \|Command: \[' build.log | tail -25; } \
            | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=Build errors::${errors:-no error lines found}"
